<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Gradient Generator</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <h1 class="title">CSS Gradient Generator</h1>

  <div id="theme-toggle">
    <button id="light-mode">Light Mode</button>
    <button id="dark-mode">Dark Mode</button>
  </div>

  <div id="gradient-preview"></div>

  <div id="controls">
    <button id="randomDesign">Random Design</button>

    <select id="gradientType">
      <option value="linear-gradient">Linear</option>
      <option value="radial-gradient">Radial</option>
      <option value="conic-gradient">Conic</option>
      <option value="repeating-linear-gradient">Repeating Linear</option>
      <option value="repeating-radial-gradient">Repeating Radial</option>
      <option value="repeating-conic-gradient">Repeating Conic</option>
    </select>

    <div id="linearControls">
      <label for="angle">Angle (deg):</label>
      <input type="number" id="angle" value="45" />
    </div>

    <div id="radialControls">
      <label for="radialShape">Shape:</label>
      <select id="radialShape">
        <option value="circle">Circle</option>
        <option value="ellipse">Ellipse</option>
      </select>

      <label for="radialSize">Size:</label>
      <select id="radialSize">
        <option value="farthest-corner">Farthest Corner</option>
        <option value="closest-side">Closest Side</option>
        <option value="closest-corner">Closest Corner</option>
        <option value="farthest-side">Farthest Side</option>
        <option value="contain">Contain</option>
        <option value="cover">Cover</option>
      </select>

      <label for="radialPosition">Position:</label>
      <input type="text" id="radialPosition" value="center" />
    </div>

    <div id="conicControls">
      <label for="conicPosition">Position:</label>
      <input type="text" id="conicPosition" value="center" />
    </div>

    <div id="colorStops">
      <div class="color-stop">
        <input type="color" value="#ff0000" />
        <input type="number" class="stop-position" placeholder="%" />
        <button class="remove-stop">Remove</button>
      </div>
      <div class="color-stop">
        <input type="color" value="#0000ff" />
        <input type="number" class="stop-position" placeholder="%" />
        <button class="remove-stop">Remove</button>
      </div>
    </div>

    <button id="addStop">Add Color Stop</button>

    <textarea id="css-code" rows="4" cols="50" readonly></textarea>
    <button id="copyCode">Copy CSS</button>
  </div>

  <script src="scripts/gradientGenerator.js"></script>
</body>
</html>
